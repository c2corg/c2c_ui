name: Clean up GitHub Pages preview

# Remove the c2corg.github.io/c2c_ui/<branch>/ preview deployed by ci.yml
# once its pull request is merged or closed, so gh-pages does not keep
# growing until it exceeds the Pages deployment size limit.
on:
  pull_request:
    types: [closed]

jobs:
  remove-preview:
    # Previews are never deployed for forks or dependabot (see ci.yml)
    if: "!github.event.pull_request.head.repo.fork && !startsWith(github.head_ref, 'dependabot/')"
    runs-on: ubuntu-latest
    # Same group as the deploy job in ci.yml, so both never push at once
    concurrency: github-pages
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: gh-pages
      - name: Remove preview folder
        # Same branch name cleaning as ci.yml (first "/" replaced by "-")
        run: |
          FOLDER="${BRANCH/\//-}"
          if [ -z "$FOLDER" ] || [ ! -d "$FOLDER" ]; then
            echo "No preview folder for $BRANCH"
            exit 0
          fi
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git rm -rq -- "$FOLDER"
          git commit -m "Remove $BRANCH branch preview"
          git push origin gh-pages
        env:
          BRANCH: ${{ github.head_ref }}
