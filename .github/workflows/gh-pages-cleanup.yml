name: Clean up GitHub Pages preview

# Remove the c2corg.github.io/c2c_ui/<branch>/ preview deployed by ci.yml
# once its pull request is merged or closed, so gh-pages does not keep
# growing until it exceeds the Pages deployment size limit.
on:
  pull_request:
    types: [closed]

jobs:
  remove-preview:
    # Previews are never deployed for forks or dependabot (see ci.yml)
    if: "!github.event.pull_request.head.repo.fork && !startsWith(github.head_ref, 'dependabot/')"
    runs-on: ubuntu-latest
    # No concurrency group shared with ci.yml's deploy: GitHub keeps one pending run per group and cancels the older
    # one, which left previews behind. The push is retried instead (below)
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: gh-pages
      - name: Remove preview folder
        # Same branch name cleaning as ci.yml (first "/" replaced by "-")
        run: |
          FOLDER="${BRANCH/\//-}"
          if [ -z "$FOLDER" ] || [ ! -d "$FOLDER" ]; then
            echo "No preview folder for $BRANCH"
            exit 0
          fi
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          # gh-pages is kept as a single parentless commit holding the current site (see ci.yml, #5084), force-pushed
          # with a lease: another deploy or clean-up may have pushed meanwhile (each in its own folder), start again
          # from it and retry
          for attempt in 1 2 3 4 5; do
            BASE=$(git rev-parse HEAD)
            git rm -rq -- "$FOLDER"
            COMMIT=$(git commit-tree "$(git write-tree)" -m "Remove $BRANCH branch preview")
            git push --force-with-lease=gh-pages:"$BASE" origin "$COMMIT:refs/heads/gh-pages" && exit 0
            sleep $((attempt * 5))
            git fetch origin gh-pages
            git reset -q --hard origin/gh-pages
            if [ ! -d "$FOLDER" ]; then
              echo "Preview folder for $BRANCH already removed"
              exit 0
            fi
          done
          exit 1
        env:
          BRANCH: ${{ github.head_ref }}
