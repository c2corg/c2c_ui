name: Continuous integration

on:
  pull_request:
    branches:
      - '**'
  push:
    branches: [master]
    tags:
      - '**'

# A newer push to a PR supersedes the previous run: cancel it, so the
# superseded build can't deploy its preview after (or instead of) the new one.
# master and tag runs each get their own group (run_id), so none is ever
# cancelled or replaced while pending, and every release completes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [lts/*]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check the tag matches the package.json version
        # health.json reports the package.json version: a tag pushed without `npm version` (see the wiki's "Make a
        # release") would ship an image reporting the previous one. Fail before the image and the release are made
        if: "startsWith(github.ref, 'refs/tags/v')"
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version: release with \`npm version (major|minor|patch)\`"
            exit 1
          fi
        env:
          TAG: ${{ github.ref_name }}
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: npm install, lint, test and build
        run: |
          npm ci
          npm run lint:no-fix
          npm test
          npm run build
        env:
          CI: ${{ true }}
      - name: Docker meta
        id: docker_meta
        if: "contains(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'"
        uses: docker/metadata-action@v6.2.0
        with:
          # list of Docker images to use as base name for tags
          images: c2corg/c2c_ui
      - name: Login to DockerHub
        if: "contains(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'"
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker images
        if: "contains(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'"
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
      - name: Get branch name
        id: branch-name
        # tj-actions/branch-names@v9 (v9.0.2), pinned by commit SHA rather than
        # the mutable "v9" tag: the tj-actions org suffered a supply-chain
        # compromise in March 2025 where release tags were rewritten to point
        # to malicious commits, so trusting a floating tag here is unsafe.
        uses: tj-actions/branch-names@5250492686b253f06fa55861556d1027b067aeb5 # v9.0.2
      - name: Create clean branch name
        id: clean_branch
        run: echo "CLEAN_BRANCH=${BRANCH/\//-}" >> $GITHUB_OUTPUT
        env:
          BRANCH: ${{ steps.branch-name.outputs.current_branch }}
      - name: Build for github pages
        run: npm run build:github
        env:
          GITHUB_PAGES_BRANCH: ${{ steps.clean_branch.outputs.CLEAN_BRANCH }}
      - name: Upload artifact for github pages
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: dist/*

  github-pages:
    needs: build
    # Dependabot PRs are never previewed: checking the branch name too, since
    # github.actor is whoever triggered the run (e.g. a maintainer re-running it).
    if: "!github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/')"
    runs-on: ubuntu-latest
    # No concurrency group shared with gh-pages-cleanup.yml: GitHub keeps one pending run per group and cancels the
    # older one, which dropped previews and clean-ups of other pull requests. Pushes are retried instead (below). Not
    # a group per pull request either: a deploy waiting for its approval would hold the clean-up back
    # Pushes to the same branch or tag (e.g. master merges in a row) deploy one at a time, the latest last: run in
    # parallel, an older build could finish after a newer one and overwrite it. Pull requests are already handled by
    # the workflow concurrency group above
    concurrency:
      group: github-pages-${{ github.event_name == 'pull_request' && github.run_id || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    # Une PR ouvre un environnement public (URL c2corg.github.io/c2c_ui/<branche>)
    # à partir de code non encore relu. On distingue donc :
    # - pull_request -> environnement "pr-preview", protégé par des reviewers
    #   requis (à configurer une fois dans Settings > Environments - cf.
    #   ../../README.md, section "Previews de PR"). Le déploiement attend
    #   qu'un mainteneur clique "Approve" avant de s'exécuter.
    # - push (master/tag, donc déjà relu et mergé) -> "github-pages-deploy",
    #   sans règle de protection : pas de friction pour du code déjà validé.
    environment: ${{ github.event_name == 'pull_request' && 'pr-preview' || 'github-pages-deploy' }}
    steps:
      - name: Check the pull request is still open
        # A preview waits for a maintainer's approval: approved after the pull request was merged or closed, it would
        # come back after gh-pages-cleanup.yml removed it
        id: pr
        if: github.event_name == 'pull_request'
        run: echo "state=$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
      - name: Get branch name
        if: steps.pr.outputs.state != 'MERGED' && steps.pr.outputs.state != 'CLOSED'
        id: branch-name
        # See comment on the other tj-actions/branch-names usage above: pinned
        # by SHA because of the March 2025 tj-actions supply-chain incident.
        uses: tj-actions/branch-names@5250492686b253f06fa55861556d1027b067aeb5 # v9.0.2
      - name: Create clean branch name
        if: steps.branch-name.outcome == 'success'
        id: clean_branch
        run: echo CLEAN_BRANCH=${BRANCH/\//-} >> $GITHUB_OUTPUT
        env:
          BRANCH: ${{ steps.branch-name.outputs.current_branch || steps.branch-name.outputs.tag }}
      - name: Checkout repository
        if: steps.branch-name.outcome == 'success'
        uses: actions/checkout@v7
        with:
          ref: gh-pages
      - name: Retrieve github pages artifact
        if: steps.branch-name.outcome == 'success'
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/site
      - name: Commit and push files
        if: steps.branch-name.outcome == 'success'
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          # another deploy or clean-up may have pushed meanwhile (each in its own folder): start again from it and
          # redo this folder only. No rebase: two deploys of the same folder rewrite the same hashed assets and conflict
          publish() { # $1: commit message, $2: "remove" to delete the folder instead of deploying the build
            for attempt in 1 2 3 4 5; do
              rm -rf -- "$FOLDER"
              [ "$2" = remove ] || cp -r "$SITE" "$FOLDER"
              git add -A .
              # Nothing to commit when the build output is unchanged (e.g. a PR
              # touching only CI config): skip instead of failing the job.
              git diff --cached --quiet && return 0
              git commit -qm "$1"
              git push origin gh-pages && return 0
              sleep $((attempt * 5))
              git fetch origin gh-pages
              git reset -q --hard origin/gh-pages
            done
            return 1
          }
          publish "Deploy $BRANCH branch"
          # the pull request closed since the check above: its clean-up may have run before this push, found no
          # folder, and left this one behind. Remove it
          if [ -n "$PR" ] && [ "$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)" != OPEN ]; then
            publish "Remove $BRANCH branch preview (pull request closed during the deploy)" remove
          fi
        env:
          BRANCH: ${{ steps.branch-name.outputs.current_branch || steps.branch-name.outputs.tag }}
          FOLDER: ${{ steps.clean_branch.outputs.CLEAN_BRANCH }}
          SITE: ${{ runner.temp }}/site
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}

  create-release:
    needs: build
    if: "startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

  push-i18n:
    needs: build
    if: "github.ref == 'refs/heads/master' && github.repository == 'c2corg/c2c_ui'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Push translations to Transifex
        run: |
          echo "::add-mask::$TOKEN"
          npm i
          npm run messages:extract
          curl --location --fail --request POST 'https://rest.api.transifex.com/resource_strings_async_uploads' --header 'Content-Type: multipart/form-data' --header "Authorization: Bearer $TOKEN" --form 'content=@"src/translations/c2corg_ui-client.pot"' --form 'resource="o:camptocamp-association:p:c2corg_ui:r:main"'
        env:
          TOKEN: ${{ secrets.TRANSIFEX_TOKEN }}
