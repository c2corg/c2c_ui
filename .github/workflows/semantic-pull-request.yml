name: 'Lint PR'

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    # This workflow runs on pull_request_target, which grants GITHUB_TOKEN
    # elevated (write) permissions and access to secrets even for PRs coming
    # from forks. Declare the minimum this job actually needs explicitly,
    # instead of relying on the repo/org default token permissions.
    permissions:
      contents: read
      pull-requests: write # sticky-pull-request-comment and srvaroa/labeler
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        id: lint_pr_title
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            revert
            i18n
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: marocchino/sticky-pull-request-comment@v2
        # When the previous steps fails, the workflow would stop. By adding this
        # condition you can continue the execution with the populated error message.
        if: always() && (steps.lint_pr_title.outputs.error_message != null)
        with:
          header: pr-title-lint-error
          message: |
            Hey there and thank you for opening this pull request! 👋🏼

            We require pull request titles to follow the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/) and it looks like your proposed title needs to be adjusted.

            Details:

            ```
            ${{ steps.lint_pr_title.outputs.error_message }}
            ```
      # Delete a previous comment when the issue has been resolved
      - if: ${{ steps.lint_pr_title.outputs.error_message == null }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-title-lint-error
          delete: true
      # Add label corresponding to conventional commit type
      - uses: srvaroa/labeler@v1.11
        with:
          config_path: .github/semantic-labels.yml
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
