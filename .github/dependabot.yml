version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 99
    labels:
      - dependabot
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - dependabot
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - dependabot
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
