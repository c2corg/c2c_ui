server {
    listen ${PORT} ${LISTEN_FLAGS};
    server_name ${SERVER_NAME};
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off; # disable the Server nginx header

    # --- Security headers ---------------------------------------------------
    # Prevent browsers from MIME-sniffing a response away from the declared
    # Content-Type (mitigates some content-sniffing based XSS attacks).
    add_header X-Content-Type-Options nosniff always;

    # camptocamp.org is not designed to be framed by another site (no embed
    # feature was found in this app), so refuse to be put in a frame/iframe
    # at all. Kept in sync with the CSP frame-ancestors directive below.
    add_header X-Frame-Options DENY always;

    # Only send the origin (not the full URL, which may contain document
    # ids/titles) to other origins; send the full URL for same-origin
    # requests and downgrades (https -> http) send nothing.
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Content-Security-Policy: pragmatic baseline, not a fully locked down
    # policy. It focuses on the directives that actually stop XSS
    # (script-src, object-src, base-uri), while staying permissive on frame-src
    # (ads, see below) and on img-src/connect-src because this app is a heavy
    # map viewer that legitimately talks to dozens of different tile/geodata
    # providers (swisstopo, IGN, ArcGIS, OpenTopoMap, basemap.at, biodiv-sports,
    # respectercestproteger-service...) whose domains cannot reasonably be
    # enumerated and change independently of this app's releases.
    #
    #   script-src: nonce-based strict CSP, as recommended by Google for GPT/AdSense
    #   (https://developers.google.com/publisher-tag/guides/content-security-policy).
    #     - 'nonce-$request_id'          only the scripts of index.html run: Vite writes a
    #                                    __CSP_NONCE__ placeholder on them (html.cspNonce in
    #                                    vite.config.ts), replaced per request by the
    #                                    /index.html location below. Injected <script> markup
    #                                    has no nonce and is blocked whatever its host.
    #     - 'strict-dynamic'             scripts created by an already trusted script are
    #                                    trusted too: lazy chunks, Google Analytics, reCAPTCHA,
    #                                    and the ad stack (hb_camptocamp.js loads GPT, Prebid,
    #                                    bidders... from hosts chosen at runtime, so no host
    #                                    allow-list can keep up with it).
    #     - https: 'unsafe-inline'       fallback for browsers without CSP3 support only:
    #                                    browsers that understand nonces and 'strict-dynamic'
    #                                    ignore both.
    #   style-src:
    #     - 'unsafe-inline' is kept because many components (OpenLayers overlays,
    #       progress/height indicators, dynamic widths...) set inline `style`
    #       attributes at runtime; there is no script-executing risk from CSS.
    #   img-src / connect-src:
    #     - kept broad (https:) on purpose: this app fetches map tiles and geo
    #       data from many third-party providers (see src/components/map,
    #       src/components/yeti/map-layers) that are not centrally listed.
    #   frame-src:
    #     - 'self' https: ad creatives render in iframes served from many ad
    #       network domains. This also covers the video players embedded in
    #       wiki articles (Markdown.vue computeVideos()), the reCAPTCHA
    #       challenge, meteoblue widgets and the hidden iframe that opens the
    #       Discourse SSO session at login (LoginView.vue).
    #   media-src:
    #     - 'self' data: blob: https: the ad stack plays <video> elements: Prebid
    #       (prebidams.js) probes autoplay support with a data:video/mp4 clip,
    #       and video ads stream from ad network hosts. Without media-src the
    #       browser falls back to default-src 'self' and blocks both.
    #   object-src 'none', base-uri 'self': block plugin content and <base> tag
    #     hijacking, the two directives with no legitimate use in this app.
    add_header Content-Security-Policy "default-src 'self'; script-src 'nonce-$request_id' 'strict-dynamic' https: 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https:; media-src 'self' data: blob: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # ------------------------------------------------------------------------

    # enable gzip
    gzip on;
    gzip_disable "msie6";

    gzip_comp_level 6;
    gzip_min_length 1100;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    location /health {
        default_type application/json;
        content_by_lua_block {
            local file = "/maintenance_mode.txt"
            local ok, err, code = os.rename(file, file)
            if not ok then
                if code == 13 then
                    -- Permission denied, but it exists
                    ngx.status = 404
                else
                    local file = "/usr/share/nginx/html/health.json"
                    local f = io.open(file, "rb")
                    local content = f:read("*all")
                    f:close()
                    ngx.print(content)
                end
            else
                ngx.status = 404
            end
        }
    }

    # Runtime configuration, rewritten when the container starts (docker/runtime-config.sh): never cached.
    location = /config.js {
        expires -1;
    }

    # Hashed build output. A missing file is an old chunk requested by a page opened before a deploy:
    # answer a real 404 (the app then reloads, see vite:preloadError in src/main.ts), never index.html,
    # which the browser refuses to run as a module.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 365d;
    }

    # index.html carries the per-request CSP nonce (see Content-Security-Policy above), so it is
    # never served as a static file: no ETag/Last-Modified, as a 304 would keep the old nonce in the
    # page while the header carries a new one, and every script would be blocked.
    location = /index.html {
        default_type text/html;
        content_by_lua_block {
            local f = io.open(ngx.var.document_root .. "/index.html", "rb")
            local html = f:read("*a")
            f:close()
            ngx.header["Cache-Control"] = "no-cache"
            ngx.print((html:gsub("__CSP_NONCE__", ngx.var.request_id)))
        }
    }

    location / {
        try_files $uri /index.html; # Force all paths to load either itself (js files) or go through index.html

        location ~* ^/[0-9a-z]+/.+$ {
            try_files $uri /index.html;
            expires 365d; # Use 1 year caching for every file not in the root folder
        }
    }
}

server {
    listen ${HEALTH_HTTP_PORT};

    location /health {
        default_type application/json;
        content_by_lua_block {
            local file = "/maintenance_mode.txt"
            local ok, err, code = os.rename(file, file)
            if not ok then
                if code == 13 then
                    -- Permission denied, but it exists
                    ngx.status = 404
                else
                    local file = "/usr/share/nginx/html/health.json"
                    local f = io.open(file, "rb")
                    local content = f:read("*all")
                    f:close()
                    ngx.print(content)
                end
            else
                ngx.status = 404
            end
        }
    }
}
